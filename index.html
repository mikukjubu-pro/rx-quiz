const unlock=async pw=>{
  const b=Uint8Array.from(atob(DATA),x=>x.charCodeAt(0)),s=crypto.subtle;
  const k=await s.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:600000,hash:'SHA-256'},await s.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['decrypt']);

};
